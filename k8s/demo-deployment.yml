
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferops-demo
  labels:
    app: inferops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inferops-demo
  template:
    metadata:
      labels:
        app: inferops-demo
    spec:
      containers:
        - name: inferops-demo
          image: inferops-demo:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8001

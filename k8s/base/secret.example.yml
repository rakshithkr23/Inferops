# TEMPLATE ONLY - not applied by kustomization.yaml and must never contain real values.
# Create the real secret from the command line instead:
#
#   kubectl -n inferops create secret generic inferops-secrets \
#     --from-literal=POSTGRES_PASSWORD='your-db-password' \
#     --from-literal=DATABASE_URL='postgresql+psycopg://inferops:your-db-password@postgres:5432/inferops' \
#     --from-literal=GEMINI_API_KEY='your-gemini-key'
apiVersion: v1
kind: Secret
metadata:
  name: inferops-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  DATABASE_URL: postgresql+psycopg://inferops:replace-me@postgres:5432/inferops
  GEMINI_API_KEY: replace-me

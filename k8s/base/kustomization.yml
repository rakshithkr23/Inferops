apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inferops

resources:
  - namespace.yml
  - configmap.yml
  - postgres.yml
  - backend.yml
  - frontend.yml

# Images are built locally (tag "local") and loaded into kind.
images:
  - name: inferops-backend
    newName: inferops-backend
    newTag: local
  - name: inferops-frontend
    newName: inferops-frontend
    newTag: local

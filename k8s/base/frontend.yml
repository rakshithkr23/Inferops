apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferops-frontend
  labels:
    app: inferops-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inferops-frontend
  template:
    metadata:
      labels:
        app: inferops-frontend
    spec:
      containers:
        - name: frontend
          image: inferops-frontend
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inferops-frontend
spec:
  type: NodePort
  selector:
    app: inferops-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30030

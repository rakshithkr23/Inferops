kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # backend API  -> http://localhost:8000
      - containerPort: 30080
        hostPort: 8000
        protocol: TCP
      # frontend UI  -> http://localhost:3000
      - containerPort: 30030
        hostPort: 3000
        protocol: TCP

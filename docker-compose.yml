services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inferops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inferops}
      POSTGRES_DB: ${POSTGRES_DB:-inferops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inferops} -d ${POSTGRES_DB:-inferops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inferops}:${POSTGRES_PASSWORD:-inferops}@db:5432/${POSTGRES_DB:-inferops}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3002}
      SEED_DEMO_DATA: "true"
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8002}
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      - backend
    mem_limit: 128m

volumes:
  pgdata:

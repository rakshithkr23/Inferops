
name: InferOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Lint with ruff
        run: ruff check backend tests

      - name: Run tests
        run: python -m pytest tests -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build and scan Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t inferops-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t inferops-frontend:ci ./frontend

      - name: Build demo app image
        run: docker build -t inferops-demo:ci ./backend/demo_app

      - name: Scan images with Trivy (report only)
        run: |
          for image in inferops-backend:ci inferops-frontend:ci inferops-demo:ci; do
            echo "=== Scanning $image ==="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 "$image"
          done

name: InferOps CI 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip 
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Run backend tests
        run: python -m pytest tests/test_main.py -v


  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build InferOps backend image
        run: docker build -t inferops-backend:ci ./backend

      - name: Build InferOps demo image
        run: docker build -t inferops-demo:ci ./backend/demo_app


